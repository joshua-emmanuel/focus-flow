@if (isEditing()) {
  <div
    class="inline-edit-card flex flex-col gap-3 p-3.5 sm:p-4 rounded-xl border-2 border-indigo-500 bg-white shadow-xs transition-all duration-150"
    (keydown.escape)="cancelEdit()"
    role="region"
    aria-label="Edit task"
  >
    <!-- Title Input -->
    <div class="flex flex-col gap-1">
      <input
        type="text"
        class="edit-title-input w-full px-3 py-2 text-sm font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-indigo-500 transition-colors"
        [value]="editTitle()"
        (input)="onTitleInput($event)"
        (keydown.enter)="saveEdit()"
        placeholder="Task title"
        aria-label="Edit task title"
        autofocus
      />
      @if (editError()) {
        <p class="edit-error-msg text-xs text-rose-600 font-medium px-1">
          {{ editError() }}
        </p>
      }
    </div>

    <!-- Controls Row -->
    <div class="flex flex-wrap items-center justify-between gap-3 pt-1 border-t border-slate-100">
      <!-- Options: Priority, Category, Due Date -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Priority Select -->
        <div class="relative">
          <label [attr.for]="'edit-priority-' + task().id" class="sr-only">Priority</label>
          <select
            [id]="'edit-priority-' + task().id"
            class="edit-priority-select text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer capitalize"
            (change)="onPrioritySelect($event)"
          >
            @for (p of priorities; track p) {
              <option [value]="p" [selected]="p === editPriority()" class="capitalize">{{ p }} Priority</option>
            }
          </select>
        </div>

        <!-- Category Select -->
        <div class="relative">
          <label [attr.for]="'edit-category-' + task().id" class="sr-only">Category</label>
          <select
            [id]="'edit-category-' + task().id"
            class="edit-category-select text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
            (change)="onCategorySelect($event)"
          >
            @for (cat of categories; track cat) {
              <option [value]="cat" [selected]="cat === editCategory()">{{ cat }}</option>
            }
          </select>
        </div>

        <!-- Due Date -->
        <div class="relative">
          <label [attr.for]="'edit-due-date-' + task().id" class="sr-only">Due Date</label>
          <input
            [id]="'edit-due-date-' + task().id"
            type="date"
            class="edit-due-date-input text-xs font-mono text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
            [value]="editDueDate()"
            (change)="onDueDateChange($event)"
          />
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="cancel-edit-btn px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer border-0"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="save-edit-btn px-3.5 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors cursor-pointer border-0 shadow-xs"
          (click)="saveEdit()"
        >
          Save Changes
        </button>
      </div>
    </div>
  </div>
} @else {
  <div
    class="task-card flex items-start justify-between gap-3.5 p-3.5 sm:p-4 rounded-xl border border-slate-200 bg-white hover:border-slate-300 hover:shadow-xs transition-all duration-150 group"
    [class.is-completed]="task().completed"
    [class.bg-slate-50]="task().completed"
    [class.opacity-75]="task().completed"
    [class.border-l-4]="isOverdue()"
    [class.border-l-rose-500]="isOverdue()"
  >
    <div class="task-card-left flex items-start gap-3 flex-1 min-w-0">
      <input
        type="checkbox"
        class="task-checkbox mt-0.5 w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer accent-indigo-600 shrink-0"
        [checked]="task().completed"
        (change)="onToggle()"
        [attr.aria-label]="
          'Mark ' + task().title + ' as ' + (task().completed ? 'incomplete' : 'complete')
        "
      />

      <div class="task-content flex flex-col gap-1.5 flex-1 min-w-0">
        <div class="task-title-line flex items-center gap-2 flex-wrap">
          <span
            class="task-title text-sm font-semibold text-slate-900 wrap-break-word"
            [class.line-through]="task().completed"
            [class.text-slate-400]="task().completed"
          >
            {{ task().title }}
          </span>
        </div>

        <div class="task-meta-line flex items-center flex-wrap gap-2 text-xs text-slate-500">
          <!-- Priority Badge -->
          <span
            class="badge text-[11px] font-medium px-2 py-0.5 rounded-full inline-flex items-center capitalize"
            [class]="priorityBadgeClass()"
          >
            {{ task().priority }}
          </span>

          <!-- Overdue Badge -->
          @if (isOverdue()) {
            <span
              class="badge badge-overdue text-[11px] font-semibold px-2 py-0.5 rounded-full bg-rose-600 text-white inline-flex items-center gap-1"
            >
              <span>⚠️</span> Overdue
            </span>
          }

          <!-- Category Badge -->
          @if (task().category) {
            <span
              class="badge text-[11px] font-medium px-2 py-0.5 rounded-full inline-flex items-center"
              [class]="categoryBadgeClass()"
            >
              {{ task().category }}
            </span>
          }

          <!-- Due Date -->
          @if (task().dueDate) {
            <span
              class="due-date-pill font-mono text-[11px] inline-flex items-center gap-1 text-slate-500"
            >
              <span>📅</span> {{ task().dueDate }}
            </span>
          }
        </div>
      </div>
    </div>

    <!-- Right Actions / Delete Confirmation -->
    <div class="task-actions-wrapper flex items-center shrink-0">
      @if (isConfirmingDelete()) {
        <div
          class="delete-confirm-box flex items-center gap-1.5 bg-rose-50 border border-rose-200 rounded-lg px-2 py-1 text-xs"
          role="group"
          aria-label="Confirm deletion"
        >
          <span class="text-rose-700 font-semibold text-[11px]">Delete?</span>
          <button
            type="button"
            class="confirm-delete-btn text-[11px] font-semibold px-2 py-0.5 rounded bg-rose-600 text-white hover:bg-rose-700 transition-colors cursor-pointer border-0"
            (click)="confirmDelete()"
            aria-label="Confirm delete task"
          >
            Yes
          </button>
          <button
            type="button"
            class="cancel-delete-btn text-[11px] font-medium px-2 py-0.5 rounded bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-colors cursor-pointer"
            (click)="cancelDelete()"
            aria-label="Cancel delete task"
          >
            No
          </button>
        </div>
      } @else {
        <div class="card-action-btns flex items-center gap-1">
          <button
            type="button"
            class="edit-btn p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors cursor-pointer border-0"
            (click)="startEdit()"
            title="Edit task"
            aria-label="Edit task"
          >
            <svg
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
              <path d="m15 5 4 4" />
            </svg>
          </button>
          <button
            type="button"
            class="delete-btn p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer border-0"
            (click)="startDelete()"
            title="Delete task"
            aria-label="Delete task"
          >
            <svg
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            </svg>
          </button>
        </div>
      }
    </div>
  </div>
}
